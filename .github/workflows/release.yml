name: Release Windows builds

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Verify release version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$packageVersion") {
            throw "Release tag must match package.json version."
          }
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
      - run: node scripts/electron-smoke.cjs --packaged
      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem release\*.exe | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -LiteralPath release\SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v7
        with:
          name: clarity-desk-windows
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseArgs = @('release', 'create', $env:GITHUB_REF_NAME)
          $releaseArgs += @(Get-ChildItem release\*.exe | ForEach-Object FullName)
          $releaseArgs += @('release\SHA256SUMS.txt', '--verify-tag')
          $notesPath = "docs/releases/$env:GITHUB_REF_NAME.md"
          if (Test-Path -LiteralPath $notesPath) {
            $releaseArgs += @('--notes-file', $notesPath)
          } else {
            $releaseArgs += '--generate-notes'
          }
          if ($env:GITHUB_REF_NAME -eq 'v0.3.0') {
            $releaseArgs += @('--prerelease', '--latest=false', '--title', 'v0.3.0 · 轻量化公开测试版')
          }
          & gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
