name: Bug report
description: Report a reproducible problem without sharing private recordings or credentials.
title: "[Bug]: "
labels: [bug]
body:
  - type: checkboxes
    attributes:
      label: Privacy check
      options:
        - label: I removed API keys, tokens, personal audio, transcripts, and private document links.
          required: true
  - type: input
    attributes:
      label: Clarity Desk version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Click ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    attributes:
      label: Non-sensitive logs
      render: shell
